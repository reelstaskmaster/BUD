name: Hermes Wrapper CI

on:
  push:
    branches: ["main", "infra/freellmapi-railway-wrapper"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Hermes wrapper
        run: docker build -f infra/freellmapi-railway/Dockerfile infra/freellmapi-railway
