name: BUD CI

on:
  push:
    branches: ["main", "agents-foundation"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q app alembic

      - name: Build Docker image
        run: docker build --tag bud-ci .

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bud
          TELEGRAM_BOT_TOKEN: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
        run: python -m alembic upgrade head

      - name: Validate Alembic metadata
        run: >-
          python -c "import importlib.util;
          specs=[('0001_initial','alembic/versions/0001_initial.py'),('0002_message_media_mime','alembic/versions/0002_message_media_mime.py')];
          mods=[];
          for name,p in specs:
          s=importlib.util.spec_from_file_location(name,p);
          m=importlib.util.module_from_spec(s); s.loader.exec_module(m); mods.append(m);
          assert mods[0].revision == '0001_initial' and mods[0].down_revision is None;
          assert mods[1].revision == '0002_message_media_mime' and mods[1].down_revision == '0001_initial'"
