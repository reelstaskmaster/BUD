name: BUD CI

on:
  push:
    branches: ["main", "agents-foundation"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app alembic

      - name: Validate Alembic configuration
        env:
          TELEGRAM_BOT_TOKEN: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
        run: python -m alembic check
