services:
  bud:
    image: nousresearch/hermes-agent:latest
    container_name: bud-hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    volumes:
      - ./hermes-data:/opt/data
    environment:
      HERMES_HOME: /opt/data
      HERMES_UID: "10000"
      HERMES_GID: "10000"
    # Do not publish the gateway API port by default.
    # Telegram works without exposing the API server.
