services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: telegpt
      POSTGRES_PASSWORD: telegpt
      POSTGRES_DB: telegpt
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telegpt -d telegpt"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://telegpt:telegpt@db:5432/telegpt
    restart: unless-stopped

volumes:
  pgdata:
